services:
  - type: web
    name: campus-digital-infra
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: "production"
      - key: DATABASE_URL
        value: "file:/app/data/prod.db"
      - key: COOKIE_SECRET
        generateValue: true
      - key: APP_BASE_URL
        value: "https://campus-digital-infra.onrender.com"
      - key: MAINTENANCE_MODE
        value: "false"
      - key: UPLOAD_ENABLED
        value: "true"
      - key: CAPTCHA_PROVIDER
        value: "disabled"
    autoDeploy: true

    # Persistent disk for production database
    disk:
      name: mrs-data
      mountPath: /app/data
      sizeGB: 1